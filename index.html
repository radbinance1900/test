<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming UI Template</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --page-bg: #b6b5a1;
      --panel: #000000;
      --accent: #ffff35;

      /* Requested RGB */
      --notch-color: rgb(15, 1, 0);
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    /* =====================================================
       TOP BLUE-HIGHLIGHTED AREA
       ===================================================== */

    body::before {
      content: "";
      position: fixed;

      width: min(720px, 55vw);
      height: 75px;

      top: 30px;
      left: 50%;
      transform: translateX(-50%);

      background: var(--notch-color);

      /*
        Shape follows the recessed top section.
      */
      clip-path: polygon(
        0 48%,
        8% 25%,
        25% 12%,
        50% 8%,
        75% 12%,
        92% 25%,
        100% 48%,
        92% 70%,
        75% 82%,
        50% 92%,
        25% 82%,
        8% 70%
      );

      z-index: 0;
    }

    /* =====================================================
       BOTTOM BLUE-HIGHLIGHTED AREA
       ===================================================== */

    body::after {
      content: "";
      position: fixed;

      width: min(710px, 55vw);
      height: 70px;

      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      background: var(--notch-color);

      clip-path: polygon(
        0 55%,
        8% 35%,
        25% 20%,
        50% 10%,
        75% 20%,
        92% 35%,
        100% 55%,
        92% 75%,
        75% 88%,
        50% 95%,
        25% 88%,
        8% 75%
      );

      z-index: 0;
    }

    /* =====================================================
       MAIN FRAME
       ===================================================== */

    .shell {
      width: min(1280px, 100%);
      min-height: 900px;

      background: var(--panel);

      /*
        KEEPING THE ORIGINAL BLACK FRAME
      */
      border: 4px solid var(--accent);

      clip-path: polygon(
        4% 0,
        23% 0,
        28% 4%,
        72% 4%,
        77% 0,
        96% 0,
        100% 5%,
        100% 95%,
        96% 100%,
        77% 100%,
        72% 96%,
        28% 96%,
        23% 100%,
        4% 100%,
        0 95%,
        0 5%
      );

      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* =====================================================
       NAVBAR
       ===================================================== */

    .navbar {
      height: 135px;
      padding: 0 65px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #000;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 32px;
      font-weight: 950;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 70px;

      margin-left: auto;
      margin-right: 60px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
    }

    .nav-button {
      border: 0;
      background: var(--accent);
      color: #000;

      padding: 20px 45px;
      border-radius: 18px;

      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =====================================================
       EMPTY HERO
       ===================================================== */

    .hero {
      min-height: 475px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px;
      background: #050505;
    }

    .hero-placeholder {
      width: 100%;
      min-height: 350px;

      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255, 255, 255, 0.15);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    /* =====================================================
       EMPTY CONTENT
       ===================================================== */

    .content {
      min-height: 280px;
      padding: 45px 55px 80px;

      background: #000;
    }

    .content-placeholder {
      min-height: 190px;
      width: 100%;

      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 18px;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {

      body {
        padding: 15px;
      }

      .shell {
        min-height: 800px;
      }

      .navbar {
        height: auto;
        min-height: 110px;

        padding: 25px 40px;

        flex-wrap: wrap;
        gap: 25px;
      }

      .nav-links {
        order: 3;

        width: 100%;
        margin: 0;

        justify-content: center;
        gap: 35px;
      }

      .hero {
        min-height: 400px;
        padding: 35px;
      }

      .content {
        padding: 35px;
      }
    }

    @media (max-width: 600px) {

      body {
        padding: 8px;
      }

      .shell {
        min-height: 700px;
      }

      .navbar {
        padding: 25px;
        justify-content: center;
      }

      .logo {
        width: 100%;
        text-align: center;
      }

      .nav-links {
        gap: 20px;
        flex-wrap: wrap;
      }

      .nav-links a {
        font-size: 14px;
      }

      .nav-button {
        width: 100%;
      }

      .hero {
        min-height: 330px;
        padding: 25px;
      }

      .hero-placeholder {
        min-height: 250px;
      }

      .content {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <header class="navbar">

      <div class="logo">
        LOGO
      </div>

      <nav class="nav-links">
        <a href="#">Discover</a>
        <a href="#">Library</a>
        <a href="#">Create</a>
        <a href="#">News</a>
        <a href="#">More</a>
      </nav>

      <button class="nav-button">
        Action
      </button>

    </header>

    <section class="hero">
      <div class="hero-placeholder">
        Hero Area
      </div>
    </section>

    <section class="content">
      <div class="content-placeholder"></div>
    </section>

  </main>

</body>
</html>
