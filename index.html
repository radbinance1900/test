<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Full Screen Gaming Template</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Main colors */
      --black: #000000;
      --yellow: #ffff35;

      /* EXACT requested RGB */
      --section-rgb: rgb(15, 1, 0);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================================
       FULL SCREEN FRAME
       ===================================================== */

    .shell {
      position: relative;

      width: 100vw;
      height: 100vh;

      background: var(--black);

      /*
        Yellow outline
      */
      border: 4px solid var(--yellow);

      /*
        Same futuristic recessed shape
      */
      clip-path: polygon(
        4% 0%,
        22% 0%,

        25% 4%,
        29% 5%,

        71% 5%,
        75% 4%,

        78% 0%,
        96% 0%,

        100% 5%,
        100% 95%,

        96% 100%,
        78% 100%,

        75% 96%,
        71% 95%,

        29% 95%,
        25% 96%,

        22% 100%,
        4% 100%,

        0% 95%,
        0% 5%
      );

      overflow: hidden;
    }

    /* =====================================================
       TOP RGB SECTION
       ===================================================== */

    .shell::before {
      content: "";

      position: absolute;

      top: 0;
      left: 20%;
      width: 60%;
      height: 48px;

      /*
        EXACT RGB
      */
      background: rgb(15, 1, 0);

      /*
        Shape of the upper recessed section
      */
      clip-path: polygon(
        0% 65%,
        8% 35%,
        25% 15%,
        50% 5%,
        75% 15%,
        92% 35%,
        100% 65%,
        92% 85%,
        75% 95%,
        50% 100%,
        25% 95%,
        8% 85%
      );

      z-index: 1;
    }

    /* =====================================================
       BOTTOM RGB SECTION
       ===================================================== */

    .shell::after {
      content: "";

      position: absolute;

      bottom: 0;
      left: 20%;
      width: 60%;
      height: 48px;

      /*
        EXACT RGB
      */
      background: rgb(15, 1, 0);

      clip-path: polygon(
        0% 35%,
        8% 15%,
        25% 5%,
        50% 0%,
        75% 5%,
        92% 15%,
        100% 35%,
        92% 65%,
        75% 85%,
        50% 95%,
        25% 85%,
        8% 65%
      );

      z-index: 1;
    }

    /* =====================================================
       NAVIGATION
       ===================================================== */

    .navbar {
      position: relative;
      z-index: 5;

      height: 135px;

      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--black);
    }

    .logo {
      color: white;

      font-size: 32px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 70px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;

      font-size: 17px;
      font-weight: 500;
    }

    .nav-links a:hover {
      opacity: 0.7;
    }

    .nav-button {
      border: none;

      background: var(--yellow);
      color: #000;

      padding: 20px 45px;

      border-radius: 18px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    /* =====================================================
       MAIN EMPTY SECTION
       ===================================================== */

    .hero {
      position: relative;
      z-index: 3;

      height: calc(100vh - 135px);

      background: #050505;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*
      Empty placeholder.
      Remove this if you want the section completely empty.
    */

    .hero-placeholder {
      width: calc(100% - 120px);
      height: calc(100% - 120px);

      border: 1px dashed rgba(255, 255, 255, 0.08);

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: rgba(255, 255, 255, 0.12);

      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* =====================================================
       TABLET
       ===================================================== */

    @media (max-width: 900px) {

      .navbar {
        height: 110px;

        padding: 0 30px;
      }

      .nav-links {
        gap: 25px;
      }

      .nav-links a {
        font-size: 14px;
      }

      .nav-button {
        padding: 16px 28px;
      }

      .hero {
        height: calc(100vh - 110px);
      }

      .hero-placeholder {
        width: calc(100% - 60px);
        height: calc(100% - 60px);
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .navbar {
        height: 100px;

        padding: 0 20px;
      }

      .logo {
        font-size: 24px;
      }

      .nav-links {
        display: none;
      }

      .nav-button {
        padding: 14px 24px;
        border-radius: 14px;
      }

      .hero {
        height: calc(100vh - 100px);
      }

      .hero-placeholder {
        width: calc(100% - 30px);
        height: calc(100% - 30px);
      }

      .shell::before,
      .shell::after {
        left: 15%;
        width: 70%;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <!-- Navigation -->
    <header class="navbar">

      <div class="logo">
        LOGO
      </div>

      <nav class="nav-links">
        <a href="#">Discover</a>
        <a href="#">Library</a>
        <a href="#">Create</a>
        <a href="#">News</a>
        <a href="#">More</a>
      </nav>

      <button class="nav-button">
        Action
      </button>

    </header>


    <!-- Empty main section -->
    <section class="hero">

      <div class="hero-placeholder">
        Hero Area
      </div>

    </section>

  </main>

</body>
</html>
